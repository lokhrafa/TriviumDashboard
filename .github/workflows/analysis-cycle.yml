name: Ciclo de análisis TVM

# GitHub puede demorar el disparo de "schedule" varios minutos en horas
# pico -- no es un cron exacto, es "al menos cada ~15 min salvo congestión".
# workflow_dispatch deja correrlo a mano desde la pestaña Actions para
# probar o forzar una actualización fuera de horario.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# El GITHUB_TOKEN automático de Actions necesita permiso de escritura para
# que publisher.py pueda actualizar docs/*.json y para que este workflow
# pueda comitear data/*.csv de vuelta al repo.
permissions:
  contents: write

# Si un ciclo tarda más de 15 min (no debería), que el siguiente espere en
# cola en vez de correr en paralelo -- dos ciclos escribiendo data/*.csv a
# la vez es exactamente lo que este proyecto evita corriendo un solo
# proceso (ver dashboard.py, cabecera del archivo).
concurrency:
  group: tvm-analysis-cycle
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar un ciclo de análisis y publicar en docs/
        env:
          TVM_GH_REPO: ${{ github.repository }}
          TVM_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python run_once_ci.py

      - name: Guardar el estado (data/*.csv) de vuelta al repo
        run: |
          git config user.name "tvm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en data/ -- nada que commitear."
          else
            git commit -m "Ciclo de análisis $(date -u +'%Y-%m-%d %H:%M UTC')"
            # publisher.py (dentro de run_once_ci.py) ya pudo haber comiteado
            # docs/*.json directo por la API mientras este checkout estaba
            # quieto -- traer eso antes de empujar o el push se rechaza.
            # Sin -X: docs/ y data/ son rutas disjuntas, no debería haber
            # conflicto real -- si algún día lo hay, mejor que falle el step
            # a que se resuelva solo y pise algo sin que nadie se entere.
            git fetch origin main
            git merge origin/main --no-edit
            git push
          fi
